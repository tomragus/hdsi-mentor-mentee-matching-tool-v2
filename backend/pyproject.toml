[project]
name = "hdsi-matching-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-multipart>=0.0.32",
    "scipy>=1.18.0",
    # Pinned exactly: these three determine the embedding vectors, so a version
    # drift here would silently change similarity scores between runs.
    "sentence-transformers==5.6.1",
    "transformers==5.14.1",
    "torch==2.13.0",
    "uvicorn[standard]>=0.52.1",
    "google-cloud-storage>=3.13.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# "." lets tests import the app package without an install step; "tests" lets
# them import the shared builders in helpers.py.
pythonpath = [".", "tests"]
testpaths = ["tests"]
